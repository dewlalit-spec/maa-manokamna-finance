
name: Build Maa Manokamna Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project
        run: |
          mkdir source
          unzip -o Maa_Manokamna_Finance_GitHub_Build.zip -d source

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/app/build.gradle")
          s = p.read_text()

          if "sourceCompatibility" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {""",
                  1
              )

          p.write_text(s)
          print("Java and Kotlin compatibility configured")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maa-Manokamna-Finance-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
