
name: Build Maa Manokamna Finance APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir source
          unzip -o Maa_Manokamna_Finance_GitHub_Build.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maa-Manokamna-Finance-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
